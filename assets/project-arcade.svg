<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Project arcade strip</title>
  <desc id="desc">Animated arcade-style project cards for Kleos, Ichnos, LeetDrill, DevFeedbackAI, and Portifolio.</desc>
  <style>
    .card-title { font: 800 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: 0; }
    .card-copy { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    .chip { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #67e8f9; }
    .card { animation: lift 4.8s ease-in-out infinite; }
    .card:nth-of-type(2) { animation-delay: .45s; }
    .card:nth-of-type(3) { animation-delay: .9s; }
    .card:nth-of-type(4) { animation-delay: 1.35s; }
    .card:nth-of-type(5) { animation-delay: 1.8s; }
    .coin { animation: coin 2.8s ease-in-out infinite; transform-origin: center; }
    .coin:nth-child(2n) { animation-delay: .7s; }
    @keyframes lift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
    @keyframes coin {
      0%, 100% { opacity: .36; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".5" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="stroke" x1="100" y1="40" x2="1080" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g opacity=".5">
    <circle class="coin" cx="64" cy="64" r="5" fill="#facc15"/>
    <circle class="coin" cx="1133" cy="55" r="5" fill="#facc15"/>
    <circle class="coin" cx="139" cy="251" r="4" fill="#67e8f9"/>
    <circle class="coin" cx="1067" cy="246" r="4" fill="#67e8f9"/>
  </g>
  <g class="card">
    <rect x="58" y="60" width="200" height="180" rx="16" fill="#0f172a" stroke="#14b8a6" stroke-width="3"/>
    <rect x="82" y="84" width="50" height="50" fill="#14b8a6"/>
    <rect x="96" y="98" width="10" height="10" fill="#020617"/>
    <rect x="114" y="98" width="10" height="10" fill="#020617"/>
    <text class="card-title" x="82" y="160">Kleos</text>
    <text class="card-copy" x="82" y="185">job outreach</text>
    <text class="chip" x="82" y="216">SMTP · SaaS</text>
  </g>
  <g class="card">
    <rect x="286" y="60" width="200" height="180" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <path d="M333 111L386 82L439 111V171L386 201L333 171V111Z" fill="#111827" stroke="#38bdf8" stroke-width="4"/>
    <text class="card-title" x="310" y="160">Ichnos</text>
    <text class="card-copy" x="310" y="185">crawler + search</text>
    <text class="chip" x="310" y="216">Go · OpenSearch</text>
  </g>
  <g class="card">
    <rect x="514" y="60" width="200" height="180" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
    <rect x="558" y="90" width="112" height="72" rx="8" fill="#111827" stroke="#818cf8" stroke-width="4"/>
    <path d="M580 126H648M614 101V151" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <text class="card-title" x="538" y="190">LeetDrill</text>
    <text class="chip" x="538" y="216">practice tracker</text>
  </g>
  <g class="card">
    <rect x="742" y="60" width="200" height="180" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
    <path d="M802 103H884M802 128H866M802 153H890" stroke="#a78bfa" stroke-width="9" stroke-linecap="round"/>
    <text class="card-title" x="766" y="190">DevFeedbackAI</text>
    <text class="chip" x="766" y="216">git · phab · AI</text>
  </g>
  <g class="card">
    <rect x="970" y="60" width="172" height="180" rx="16" fill="#0f172a" stroke="url(#stroke)" stroke-width="3"/>
    <circle cx="1056" cy="118" r="37" fill="#111827" stroke="#67e8f9" stroke-width="4"/>
    <path d="M1034 118H1078M1056 96V140" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
    <text class="card-title" x="994" y="190">Portfolio</text>
    <text class="chip" x="994" y="216">abhiyadav.in</text>
  </g>
</svg>
