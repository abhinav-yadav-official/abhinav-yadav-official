<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Symmetric project arcade strip</title>
  <desc id="desc">Five matching animated project cards with consistent icon templates and different accent colors.</desc>
  <style>
    .card-title { font: 800 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: 0; }
    .card-copy { font: 650 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    .chip { font: 750 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #67e8f9; }
    .card { animation: lift 4.8s ease-in-out infinite; }
    .card:nth-of-type(2) { animation-delay: .45s; }
    .card:nth-of-type(3) { animation-delay: .9s; }
    .card:nth-of-type(4) { animation-delay: 1.35s; }
    .card:nth-of-type(5) { animation-delay: 1.8s; }
    .coin { animation: coin 2.8s ease-in-out infinite; transform-origin: center; }
    .coin:nth-child(2n) { animation-delay: .7s; }
    @keyframes lift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes coin {
      0%, 100% { opacity: .36; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".5" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="frame" x1="20" y1="30" x2="1180" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="12" y="12" width="1176" height="276" rx="20" stroke="url(#frame)" stroke-opacity=".35"/>
  <g opacity=".55">
    <circle class="coin" cx="64" cy="64" r="5" fill="#facc15"/>
    <circle class="coin" cx="1133" cy="55" r="5" fill="#facc15"/>
    <circle class="coin" cx="139" cy="251" r="4" fill="#67e8f9"/>
    <circle class="coin" cx="1067" cy="246" r="4" fill="#67e8f9"/>
  </g>

  <g class="card">
    <rect x="58" y="58" width="200" height="184" rx="16" fill="#0f172a" stroke="#14b8a6" stroke-width="3"/>
    <rect x="106" y="82" width="104" height="78" rx="10" fill="#111827" stroke="#14b8a6" stroke-width="4"/>
    <rect x="132" y="106" width="16" height="16" fill="#14b8a6"/>
    <rect x="168" y="106" width="16" height="16" fill="#14b8a6"/>
    <path d="M134 140H182" stroke="#14b8a6" stroke-width="8" stroke-linecap="round"/>
    <text class="card-title" x="82" y="188">Kleos</text>
    <text class="card-copy" x="82" y="211">job outreach</text>
    <text class="chip" x="82" y="232">SMTP · SaaS</text>
  </g>

  <g class="card">
    <rect x="286" y="58" width="200" height="184" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="334" y="82" width="104" height="78" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="4"/>
    <path d="M386 94L424 116V158L386 181L348 158V116L386 94Z" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <path d="M386 94V138M348 116L386 138L424 116M386 138V181" stroke="#38bdf8" stroke-width="3"/>
    <text class="card-title" x="310" y="188">Ichnos</text>
    <text class="card-copy" x="310" y="211">crawler + search</text>
    <text class="chip" x="310" y="232">Go · OpenSearch</text>
  </g>

  <g class="card">
    <rect x="514" y="58" width="200" height="184" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
    <rect x="562" y="82" width="104" height="78" rx="10" fill="#111827" stroke="#818cf8" stroke-width="4"/>
    <path d="M586 121H642M614 96V146" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <text class="card-title" x="538" y="188">LeetDrill</text>
    <text class="card-copy" x="538" y="211">practice tracker</text>
    <text class="chip" x="538" y="232">self-hosted</text>
  </g>

  <g class="card">
    <rect x="742" y="58" width="200" height="184" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
    <rect x="790" y="82" width="104" height="78" rx="10" fill="#111827" stroke="#a78bfa" stroke-width="4"/>
    <path d="M812 106H872M812 124H858M812 142H878" stroke="#a78bfa" stroke-width="8" stroke-linecap="round"/>
    <text class="card-title" x="766" y="188">DevFeedback</text>
    <text class="card-copy" x="766" y="211">activity to review</text>
    <text class="chip" x="766" y="232">git · phab · AI</text>
  </g>

  <g class="card">
    <rect x="970" y="58" width="172" height="184" rx="16" fill="#0f172a" stroke="#67e8f9" stroke-width="3"/>
    <rect x="1004" y="82" width="104" height="78" rx="10" fill="#111827" stroke="#67e8f9" stroke-width="4"/>
    <circle cx="1056" cy="121" r="28" fill="#0f172a" stroke="#67e8f9" stroke-width="4"/>
    <path d="M1037 121H1075M1056 102V140" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
    <text class="card-title" x="994" y="188">Portfolio</text>
    <text class="card-copy" x="994" y="211">resume hub</text>
    <text class="chip" x="994" y="232">abhiyadav.in</text>
  </g>
</svg>
